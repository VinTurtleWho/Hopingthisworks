name: Build Bloodstrike Native Library

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Configure and Build
        run: |
          cmake -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_LATEST_HOME }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -S app/src/main/jni
          cmake --build build-${{ matrix.abi }} --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodstrike-lib-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/**/*.so
          
